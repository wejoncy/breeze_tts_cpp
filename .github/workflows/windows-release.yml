name: Windows release package

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA Toolkit version
        type: string
        default: '13.2.0'
      cuda_architectures:
        description: 'CMake CUDA architectures (default: RTX 30/40/50, with PTX for SM120)'
        type: string
        default: '86-real;89-real;120'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
      CARGO_HOME: ${{ github.workspace }}/build/cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo-target
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/cache/vcpkg
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ inputs.cuda_version }}
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cuobjdump"]'
          use-github-cache: false

      - name: Fetch pinned audio build tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: 054bd01bec7f31492ec9ac063740cc984a0fe59e
          path: build/ci/vcpkg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/cache/vcpkg
          key: windows-x64-audio-${{ hashFiles('.github/windows/vcpkg.json') }}
      - name: Build audio dependencies
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & ./build/ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/ci/vcpkg/vcpkg.exe install --triplet x64-windows `
            --x-manifest-root=.github/windows --x-install-root=build/ci/audio
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Configure and build Release
        run: |
          if ($env:CUDA_ARCHITECTURES -notmatch '^\d+(-(real|virtual))?(;\d+(-(real|virtual))?)*$') {
            throw 'Supply explicit CUDA architectures; native would bind the package to the build machine.'
          }
          cmake --version
          cargo --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $audio = Join-Path $PWD 'build/ci/audio/x64-windows'
          cmake -S . -B build/ci/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$audio" `
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCHITECTURES" `
            "-DTTS_RUNTIME_DIRECTORIES=$audio/bin;$env:CUDA_PATH/bin;$env:CUDA_PATH/bin/x64" `
            -DTTS_BUILD_SERVER=ON -DTTS_BUILD_PYTHON=OFF `
            -DTTS_ENABLE_GPT_SOVITS=OFF -DTTS_BUILD_HOPPER_KERNELS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Limit template-heavy CUDA compilation by available RAM as well as CPU count.
          $freeMemory = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1KB
          $jobs = [Math]::Max(1, [Math]::Min([Environment]::ProcessorCount, [Math]::Floor($freeMemory / 3GB)))
          cmake --build build/ci/release --parallel $jobs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package and inspect runtime dependencies
        run: |
          ./scripts/package-windows.ps1 -BuildDirectory build/ci/release `
            -Destination build/ci/package -AudioPrefix build/ci/audio/x64-windows `
            -CudaPath $env:CUDA_PATH -ExpectedArchitectures $env:CUDA_ARCHITECTURES
          Compress-Archive -Path build/ci/package/* -DestinationPath build/ci/tts-windows-x64.zip
          (Get-FileHash build/ci/tts-windows-x64.zip -Algorithm SHA256).Hash |
            Set-Content build/ci/tts-windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tts-windows-x64
          path: |
            build/ci/tts-windows-x64.zip
            build/ci/tts-windows-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tts-windows-x64
          path: artifact
      - name: Run relocated package without a development environment
        run: |
          $zip = Resolve-Path artifact/tts-windows-x64.zip
          $expected = (Get-Content artifact/tts-windows-x64.zip.sha256 -Raw).Trim()
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Checksum mismatch' }
          $package = Join-Path $env:RUNNER_TEMP 'relocated tts package'
          Expand-Archive -LiteralPath $zip -DestinationPath $package
          Remove-Item Env:CUDA_PATH* -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Set-Location $env:RUNNER_TEMP
          foreach ($program in @('tts-server.exe', 'tts.exe')) {
            $help = & (Join-Path $package $program) --help 2>&1
            if ($LASTEXITCODE -ne 0 -or -not ($help -match '--model')) {
              throw "$program failed outside the build environment: $help"
            }
            Write-Output "$program --help passed"
          }
          'RTX 30/40/50 kernels packaged; GPU inference requires validation on GPU hardware.' |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
